<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>影片回想可視化播放器</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif;
        }
        
        #container {
            display: flex;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
        }
        
        #video-area {
            flex: 7;  /* 改為 7，占 70% 寬 */
            display: flex;
            flex-direction: column;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        video {
            width: 100%;
            height: auto;  /* 關鍵：保持原始比例 */
            max-height: 100%;
        }
        
        #subtitles {
            padding: 15px;
            background: rgba(0,0,0,0.8);
            color: white;
            text-align: center;
            min-height: 40px;
            font-size: 30px;
        }
        
        #recall-sidebar {
            flex: 3;  /* 改為 3，占 30% 寬 */
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        #recall-sidebar h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }
        
        #recall-grid {
            display: flex;
            flex-direction: column;  /* 改為竪排（1 列） */
            gap: 10px;
            flex: 1;
        }
        
        .recall-item {
            flex: 0 0 auto;  /* 不拉伸，保持原大小 */
            border: 2px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.15s ease-out, border-color 0.15s;
            background: #f9f9f9;
            cursor: pointer;
        }

        .recall-item:hover {
            border-color: #4a90d9;
        }
        
        .recall-item.low-confidence {
            border-color: #ffaa00;
        }
        
        .recall-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }
        
        .recall-info {
            padding: 8px;
            font-size: 12px;
            background: #fff;
        }
        
        .recall-type {
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }
        
        .recall-cue {
            color: #666;
            font-style: italic;
            margin-bottom: 4px;
            word-wrap: break-word;
        }
        
        .confidence-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            background: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 左邊：70% 的空間 -->
        <div id="video-area">
            <div id="video-wrapper">
                <video id="main-video" controls></video>
            </div>
            <div id="subtitles"></div>
        </div>
        
        <!-- 右邊：30% 的空間 -->
        <div id="recall-sidebar">
            <h3>🎯 回想內容</h3>
            <div id="recall-grid"></div>
        </div>
    </div>
    
    <script>
        class VideoPlayer {
            constructor() {
                this.video = document.getElementById('main-video');
                this.subtitleDiv = document.getElementById('subtitles');
                this.recallGrid = document.getElementById('recall-grid');
                this.transcript = null;
                this.recalls = [];
                this.shownRecalls = new Set();     // 目前顯示中的 recall ID
                this.recallOrderCounter = 0;       // 堆疊順序計數器
                this.recallBySegment = new Map();  // segment_idx → [recalls]（字幕標注用）
                this.textToTime = {};              // recalled_text → segment time（字幕標注用）

                this.video.addEventListener('timeupdate', () => this.update());
                this.loadJsonFromUrl();
            }

            loadJsonFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const jsonPath = params.get('json') || '/outputs/results/final.json';

                fetch(jsonPath)
                    .then(r => r.json())
                    .then(data => {
                        this.transcript = data;
                        this.recalls = data.recalls || [];

                        // 建立 recalled_text → segment time 對照表（供字幕標注查時間）
                        (data.segments || []).forEach(s => {
                            this.textToTime[s.text] = s.time;
                        });

                        // 建立 segment_idx → recalls 對照表（供字幕標注使用）
                        this.recalls.forEach(r => {
                            const idx = r.segment_idx;
                            if (!this.recallBySegment.has(idx)) this.recallBySegment.set(idx, []);
                            this.recallBySegment.get(idx).push(r);
                        });

                        this.video.src = data.video_path || '../demo_video/video.mp4';

                        if (data.subtitle_path) {
                            const track = document.createElement('track');
                            track.kind = 'subtitles';
                            track.src = data.subtitle_path;
                            track.srclang = 'zh';
                            this.video.appendChild(track);
                        }

                        console.log(`✓ 已載入 ${this.recalls.length} 個 recall`);
                        console.log(`✓ 影片: ${data.video_path}`);
                        console.log(`✓ 字幕: ${data.subtitle_path}`);
                        console.log(`✓ 總段落: ${data.total_segments}`);
                    })
                    .catch(err => {
                        console.error('載入 JSON 失敗:', err);
                        this.subtitleDiv.textContent = '❌ 無法載入數據: ' + err.message;
                    });
            }

            update() {
                const currentTime = this.video.currentTime;
                this.updateSubtitles(currentTime);
                this.showRecallFrames(currentTime);
            }

            updateSubtitles(currentTime) {
                if (!this.transcript || !this.transcript.segments) return;

                const currentSegment = this.transcript.segments.find(
                    s => s.start <= currentTime && currentTime < s.end
                );

                if (!currentSegment) {
                    this.subtitleDiv.innerHTML = '';
                    return;
                }

                const recalls = this.recallBySegment.get(currentSegment.segment_idx) || [];

                if (recalls.length > 0) {
                    // 在字幕上方加 [↑ [0:00:00] recalled text...] 標注
                    const annotations = recalls.map(r => {
                        const arrow = r.recall_type === 'contrast' ? '↔' : '↑';
                        const time = this.textToTime[r.recalled_text] || '';
                        const preview = r.recalled_text.slice(0, 30);
                        return `[${arrow} ${time} ${this._esc(preview)}...]`;
                    }).join(' ');

                    this.subtitleDiv.innerHTML =
                        `<div style="color:#aaa;font-size:20px;margin-bottom:4px;">${annotations}</div>` +
                        `<div>${this._esc(currentSegment.text)}</div>`;
                } else {
                    this.subtitleDiv.textContent = currentSegment.text;
                }
            }

            _esc(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            showRecallFrames(currentTime) {
                const displayDuration = 10;  // 秒：recall frame 顯示的時間長度

                // 純區間判斷：precise_time_seconds <= currentTime <= precise_time_seconds + 10
                this.recalls.forEach((recall, idx) => {
                    const recallId = `${recall.segment_idx}_${idx}`;
                    const t = recall.precise_time_seconds || 0;
                    const shouldShow = currentTime >= t && currentTime <= t + displayDuration;
                    const isShown = this.shownRecalls.has(recallId);

                    if (shouldShow && !isShown) {
                        this.addRecallItem(recall, recallId);
                        this.shownRecalls.add(recallId);
                    } else if (!shouldShow && isShown) {
                        this.removeRecallItem(recallId);
                    }
                });
            }

            removeRecallItem(recallId) {
                const element = document.getElementById(`recall_${recallId}`);
                if (element) {
                    element.style.opacity = '0';
                    setTimeout(() => {
                        if (element.parentNode) element.parentNode.removeChild(element);
                    }, 150);
                }
                this.shownRecalls.delete(recallId);
            }

            addRecallItem(recall, recallId) {
                const item = document.createElement('div');
                item.className = 'recall-item';
                item.id = `recall_${recallId}`;
                item.style.order = this.recallOrderCounter++;

                if (recall.confidence < 0.7) item.classList.add('low-confidence');

                const confidencePercent = Math.round((recall.confidence || 0) * 100);
                const typeLabel = recall.recall_type === 'direct' ? 'Direct' : 'Contrast';
                const frameUrl = recall.frame_cropped || recall.frame_original;

                let mediaHtml = '';
                if (frameUrl) {
                    mediaHtml = `<img src="${frameUrl}" alt="Recall frame" onerror="this.alt='圖片載入失敗'">`;
                } else {
                    mediaHtml = `<div style="width:100%;padding:20px;background:#e8e8e8;text-align:center;font-size:14px;color:#999;">📝 無圖片</div>`;
                }

                item.innerHTML = `
                    ${mediaHtml}
                    <div class="recall-info">
                        <div class="recall-type">${typeLabel}</div>
                        <div class="recall-text">「${this._esc(recall.recalled_concept || recall.recalled_text)}」</div>
                        <div style="font-size:11px;color:#999;margin-top:4px;">信心: ${confidencePercent}%</div>
                    </div>
                `;

                // 點擊跳回被回想 segment 的起始時間
                item.addEventListener('click', () => {
                    this.video.currentTime = recall.recalled_start_seconds || 0;
                    this.video.play();
                });

                this.recallGrid.appendChild(item);
            }
        }

        /* 初始化 */
        document.addEventListener('DOMContentLoaded', () => {
            new VideoPlayer();
        });
    </script>
</body>
</html>
